name: "Main / Pull requests build"
on:
    pull_request:
        paths-ignore:
            - '.txt'
            - 'LICENSE'
            - 'docs/**'
        branches: [ main ]
    push:
        branches:
            - main

jobs:
    pre-commit:
        name: Pre-commit check
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout git repository
                uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
            -   name: Setup python
                uses: actions/setup-python@6d4e3b7a2f9a4e3b9c1b7a5d6e7f8a9b0c1d2e3f
                with:
                    python-version: "3.9"
            -   name: Setup Java
                uses: ./.github/actions/java-setup
                with:
                    cache: ""
            -   name: Pre-commit checks
                uses: pre-commit/action@3a1b2c3d4e5f67890123456789abcdef01234567
            -   name: pre-commit-c-lite
                uses: pre-commit-ci/lite-action@1234567890abcdef1234567890abcdef12345678
                if: always()
    build:
        runs-on: ${{ matrix.os }}
        needs: [ pre-commit ]
        strategy:
            fail-fast: true
            matrix:
                os: [ windows-latest, ubuntu-latest, macos-15-intel ]
            max-parallel: 1
        steps:
            -   uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
            -   name: Set up JDK
                uses: ./.github/actions/java-setup
                with:
                    cache: 'maven'
            -   name: Build with Maven
                run: mvn --no-transfer-progress verify
